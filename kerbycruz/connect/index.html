<!DOCTYPE html>
<html>
   <head>
      <title>Connect | Kerby</title>
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
      <link rel="stylesheet" href="../styles.css">
      <link rel="icon" href="../assets/logo.png" type="image">
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
   </head>
   <body>
      <div class="nav_container">
         <div class="tab">
            <a href="/kerbycruz/" target="_self">
               <img id="logo" src="../assets/logo.png" class="icon" alt="Logo" />
            </a>
            <button class="hamburger" aria-label="Menu">
               <span class="bar"></span>
               <span class="bar"></span>
               <span class="bar"></span>
            </button>
            <nav class="nav_menu">
          <ul class="nav_list">
            <li><a href="/kerbycruz/" >Home</a></li>
            <li><a href="/kerbycruz/about/">About</a></li>
            <li><a href="/kerbycruz/project/">Project</a></li>
            <li><a href="/kerbycruz/connect/"class="active">Connect</a></li>
          </ul>
        </nav>
         </div>
      </div>
      <div class="main_content">
        <h2 id="header">Connect</h2>
        <p id="connect_paragraph">Send me a message and I'll get back to you as soon as possible.</p>
        <div class="form_container">
          <form>
            <label>
              <input type="text" placeholder="Email">
            </label>
            <label>
              <input type="text" placeholder="Name">
            </label>
            <textarea placeholder="Message"></textarea>
            <button type="submit">Send</button>
          </form>
        </div>

    </div>
    <footer class="footer">
     <div class="footer_left">
       <a href="/kerbycruz/" target="_self">
       <img src="../assets/logo.png" alt="KC Logo" class="footer_logo">
       </a>
     </div>
     <div class="footer_center">
       <p>Kerby Llamoso Cruz©2025</p>
       <p class="rights">All Rights Reserved</p>
     </div>
     <div class="footer_right">
       <a href="https://facebook.com/kerbyllamosocruz" target="_blank">
         <img src="../assets/facebook.png" alt="Facebook" class="social_icon">
         <p>Facebook.com/kerbyllamosocruz</p>
       </a>
       <a href="https://instagram.com/kerbyllamosocruz" target="_blank">
         <img src="../assets/instagram.png" alt="Instagram" class="social_icon">
         <p>Instagram.com/kerbyllamosocruz</p>
       </a>
       <a href="https://github.com/kerbycruz" target="_blank">
         <img src="../assets/github.png" alt="GitHub" class="social_icon">
         <p>Github.com/kerbycruz</p>
       </a>
     </div>
   </footer>
  <script>
        const hamburger = document.querySelector(".hamburger");
        const navMenu = document.querySelector(".nav_menu");

        hamburger.addEventListener("click", () => {
           hamburger.classList.toggle("active");
           navMenu.classList.toggle("active");
        });

        document.querySelectorAll(".nav_list a").forEach(n => n.addEventListener("click", () => {
           hamburger.classList.remove("active");
           navMenu.classList.remove("active");
        }));

        document.querySelector('form').addEventListener('submit', function(e) {
            e.preventDefault();
            
            fetch(this.action, {
                method: 'POST',
                body: new FormData(this)
            })
            .then(response => {
                if (response.ok) {
                    alert('Thank you for your message! I will get back to you soon.');
                    this.reset();
                } else {
                    alert('Something went wrong. Please try again later.');
                }
            })
            .catch(error => {
                alert('Something went wrong. Please try again later.');
            });
        });
     </script>
   </body>
</html>
